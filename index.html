<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">

<style>

nav button{flex:1;border:0;background:none;color:var(--m);padding:8px 0;font-size:11px}nav button b{display:block;font-size:20px;font-weight:400}nav .on{color:var(--a)}
.card{display:flex;align-items:center;gap:10px;background:var(--c);border-radius:var(--r);padding:10px 12px;margin:8px 0;border-left:4px solid var(--a)}

.box{background:var(--c);border-radius:var(--r);padding:12px;margin:10px 0}.box h3{margin:0 0 6px;font-size:14px;color:var(--m);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
button.p,button.s{border:0;border-radius:10px;padding:9px 14px;font-size:14px;background:var(--a);color:#fff}button.s{background:var(--l);color:var(--t)}
button.ic{border:0;background:none;font-size:16px;padding:4px}
.chip{border:1px solid var(--l);background:none;color:var(--t);border-radius:99px;padding:5px 12px;font-size:13px}.chip.on{background:var(--a);color:#fff;border-color:var(--a)}

#modal.on{display:flex}#modal>div{background:var(--c);width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;max-width:720px;margin:auto}

.th{width:48px;height:48px;object-fit:cover;border-radius:8px;background:var(--l)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--l)}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}.cal div{padding:7px 0;border-radius:8px;font-size:13px;position:relative}.cal .h{color:var(--m);font-size:11px}
.cal .d{background:var(--c)}.cal .t{outline:2px solid var(--a)}.cal .s{background:var(--a);color:#fff}.cal i{position:absolute;bottom:2px;left:50%;width:5px;height:5px;margin-left:-2px;border-radius:50%;background:#e0568a}
.bar{height:8px;background:var(--l);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}.bar.x i{background:#d9534f}
.tag{font-size:10px;background:#f5a623;color:#000;border-radius:5px;padding:1px 5px}.empty{text-align:center;color:var(--m);padding:26px 10px}
.warn{background:#f5a62322;border-radius:10px;padding:8px;font-size:13px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid var(--l);padding:5px;text-align:left;vertical-align:top}
#st.r{background:#d9534f;color:#fff}#st.g{background:#2e9e5b;color:#fff}
.rimg{width:100%;max-height:230px;object-fit:cover;border-radius:12px;margin-bottom:8px}.rv h2{margin:4px 0}.rv .rm{color:var(--m);margin:0 0 6px}.rv h4{margin:14px 0 4px}.rv ul,.rv ol{padding-left:22px;margin:0;line-height:1.7}.rv li{padding:2px 0}
</style></head><body>
<header><h1 id="ti">Nuestro Hogar</h1><span id="st" onclick="sync()"></span></header>
<main id="v"></main><nav id="nav"></nav><div id="modal"></div><div id="toast"></div>
<script>
'use strict';
/* ============ UTILIDADES ============ */
const KEY='nh_v1',$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const iso=d=>{const z=new Date(d);return z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0')+'-'+String(z.getDate()).padStart(2,'0')};
const today=()=>iso(new Date()),addD=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return iso(d)};
const fmt=s=>s?new Date(s+'T00:00').toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short'}):'';
const money=n=>(+n||0).toLocaleString('es-MX',{style:'currency',currency:'MXN'});
const DAYS=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
/* ============ ESTADO LOCAL ============ */
let DB=(()=>{try{const d=JSON.parse(localStorage.getItem(KEY));if(d)return d}catch(e){}
 return{users:[{id:'u1',name:'Yo',color:'#2f80ed'},{id:'u2',name:'Esposa',color:'#e0568a'}],me:'u1',dark:null,data:{},q:[],int:{},last:null}})();
DB.known=DB.known||{};DB.hc=DB.hc||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('Almacenamiento lleno')}status()}
/* Archivos (fotos/documentos) en IndexedDB: nunca en localStorage ni en Sheets */
const IDB={p:null,open(){return this.p||(this.p=new Promise((a,b)=>{const r=indexedDB.open('nh_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)}))},
 async tx(m,fn){const d=await this.open();return new Promise((a,b)=>{const t=d.transaction('f',m),q=fn(t.objectStore('f'));t.oncomplete=()=>a(q&&q.result);t.onerror=()=>b(t.error)})},
 put(k,v){return this.tx('readwrite',s=>s.put(v,k))},get(k){return this.tx('readonly',s=>s.get(k))},del(k){return this.tx('readwrite',s=>s.delete(k))}};
/* ============ MÓDULOS (esquema -> hoja de Google Sheets) ============ */
const CAT={ev:['Familia','Trabajo','Escuela','Salud','Otro'],task:['Hogar','Limpieza','Compras','Familia','Personal','Otros'],shop:['Frutas y verduras','Carnes','Lácteos','Despensa','Limpieza','Higiene personal','Otros'],
 exp:['Supermercado','Servicios','Transporte','Vivienda','Salud','Educación','Entretenimiento','Restaurantes','Otros'],img:['Menús','Información familiar','Escuela','Hogar','Referencias','Otros'],doc:['Identificaciones','Escuela','Salud','Hogar','Finanzas','Otros']};
const W=()=>DB.users.map(u=>[u.id,u.name]).concat([['both','Ambos']]);
const uName=id=>id==='both'?'Ambos':(DB.users.find(u=>u.id===id)||{}).name||'';
const uCol=id=>(DB.users.find(u=>u.id===id)||{}).color||'var(--a)';
const REC=['No','Semanal','Mensual','Anual'];
/* campo: [clave,etiqueta,tipo,opciones,requerido] */
const M={
events:{s:'Events',t:'Evento',i:'📅',f:[['title','Título','text',0,1],['date','Fecha','date',0,1],['time','Hora','time'],['who','Para','who'],['cat','Categoría','sel',CAT.ev],['rec','Se repite','sel',REC],['rem','Recordatorio','sel',['Ninguno','15 min','1 hora','1 día']],['note','Notas','area']],r:x=>[x.title,fmt(x.date)+(x.time?' · '+x.time:'')+' · '+x.cat]},
tasks:{s:'Tasks',t:'Tarea',i:'✅',chk:1,f:[['title','Tarea','text',0,1],['who','Responsable','who'],['due','Fecha límite','date'],['prio','Prioridad','sel',['Media','Alta','Baja']],['cat','Categoría','sel',CAT.task],['rec','Se repite','sel',REC]],r:x=>[x.title,[x.prio,x.cat,x.due&&'vence '+fmt(x.due),x.done&&'hecha '+fmt(x.doneAt)].filter(Boolean).join(' · ')]},
shop:{s:'ShoppingItems',t:'Producto',i:'🛒',chk:1,f:[['name','Producto','text',0,1],['qty','Cantidad','text'],['list','Lista','text'],['cat','Categoría','sel',CAT.shop]],r:x=>[x.name,[S.all&&('📋 '+(x.list||'Súper')),x.qty,x.cat,'por '+uName(x.by)].filter(Boolean).join(' · ')]},
recipes:{s:'Recipes',t:'Receta',i:'🍲',img:'photo',f:[['name','Nombre','text',0,1],['photo','Fotografía','file','image/*'],['time','Minutos','number'],['portions','Porciones','number'],['cat','Categoría','text'],['ing','Ingredientes (uno por línea, con cantidad)','area'],['steps','Preparación','area'],['fav','Favorita','check']],r:x=>[(x.fav?'★ ':'')+x.name,[x.time&&x.time+' min',x.portions&&x.portions+' porc.',x.cat].filter(Boolean).join(' · ')]},
meals:{s:'MealPlans',t:'Comida',i:'🍽️',img:'photo',f:[['date','Día','date',0,1],['slot','Momento','sel',['Desayuno','Comida','Cena','Colación']],['name','Platillo','text',0,1],['recipe','Usar receta','sel',()=>['—',...(DB.data.recipes||[]).map(r=>r.name)]],['photo','Fotografía','file','image/*'],['ing','Ingredientes (uno por línea)','area']],r:x=>[x.name,x.slot+' · '+fmt(x.date)],
  on(r){if(r.recipe&&r.recipe!=='—'&&!r.ing){const q=(DB.data.recipes||[]).find(a=>a.name===r.recipe);if(q)r.ing=q.ing||''}},
  x:x=>`<button class="ic" title="Ingredientes a compras" onclick="toShop('${x.id}')">🛒</button><button class="ic" title="Duplicar" onclick="dup('${x.id}')">⧉</button>`},
exp:{s:'Expenses',t:'Movimiento',i:'💰',f:[['type','Tipo','sel',['Gasto','Ingreso']],['amount','Monto','number',0,1],['cat','Categoría','sel',CAT.exp],['date','Fecha','date',0,1],['who','Responsable','who'],['shared','Gasto compartido','check'],['note','Nota','text']],r:x=>[(x.type==='Ingreso'?'+ ':'− ')+money(x.amount),[x.cat,fmt(x.date),x.note].filter(Boolean).join(' · ')]},
budgets:{s:'Budgets',t:'Presupuesto',i:'🎯',f:[['cat','Categoría','sel',CAT.exp],['limit','Límite mensual','number',0,1]],r:x=>[x.cat,'Límite '+money(x.limit)]},
docs:{s:'Documents',t:'Documento',i:'📄',f:[['title','Título','text',0,1],['cat','Categoría','sel',CAT.doc],['file','Archivo','file','',1],['desc','Descripción','area']],r:x=>[x.title,[x.cat,fmt((x.created||'').slice(0,10)),'subió '+uName(x.by)].join(' · ')],x:x=>`<button class="ic" onclick="openF('${x.id}','file')">⬇</button>`},
images:{s:'Images',t:'Imagen',i:'🖼️',img:'file',f:[['title','Título','text',0,1],['cat','Categoría','sel',CAT.img],['file','Foto (galería o cámara)','file','image/*',1],['desc','Descripción','area']],r:x=>[x.title,[x.cat,fmt((x.created||'').slice(0,10)),uName(x.by)].join(' · ')]},
sched:{s:'Schedules',t:'Horario',i:'🕒',f:[['title','Actividad','text',0,1],['who','Integrante','who'],['day','Día','sel',DAYS],['start','Inicio','time'],['end','Fin','time'],['kind','Tipo','sel',['Trabajo','Escuela','Actividad','Otro']],['alt','Horario alterno','check']],r:x=>[x.title,x.day+' '+(x.start||'')+'–'+(x.end||'')+' · '+x.kind+(x.alt?' (alterno)':'')]},
special:{s:'SpecialDays',t:'Fecha especial',i:'🎂',f:[['title','Nombre','text',0,1],['date','Fecha','date',0,1],['kind','Tipo','sel',['Cumpleaños','Aniversario','Otro']],['who','De','who']],r:x=>[x.title,x.kind+' · '+fmt(x.date)+' · '+dleft(x)]}
};
/* ============ FECHAS Y RECURRENCIA ============ */
function occ(e,from){const d=e.date||e.due;if(!d)return null;if(d>=from)return d;const r=e.rec||'No';if(r==='No')return null;const b=new Date(d+'T00:00'),f=new Date(from+'T00:00');
 if(r==='Anual'){const x=new Date(f.getFullYear(),b.getMonth(),b.getDate());if(x<f)x.setFullYear(x.getFullYear()+1);return iso(x)}
 if(r==='Mensual'){const x=new Date(f.getFullYear(),f.getMonth(),b.getDate());if(x<f)x.setMonth(x.getMonth()+1);return iso(x)}
 const n=Math.ceil((f-b)/864e5/7),x=new Date(b);x.setDate(b.getDate()+n*7);return iso(x)}
const sp=x=>({date:x.date,rec:'Anual'});
function dleft(x){const o=occ(sp(x),today());if(!o)return '';const n=Math.round((new Date(o+'T00:00')-new Date(today()+'T00:00'))/864e5);return n===0?'¡hoy!':'faltan '+n+' d'}
const L=m=>DB.data[m]||(DB.data[m]=[]);
function onDay(d){return[...L('events').filter(e=>occ(e,d)===d).map(e=>({...e,k:'e'})),...L('special').filter(e=>occ(sp(e),d)===d).map(e=>({...e,k:'s'}))]}
/* ============ CRUD + COLA DE SINCRONIZACIÓN ============ */
function enq(op,m,rec){DB.q=DB.q.filter(o=>!(o.id===rec.id&&o.sheet===M[m].s));DB.q.push({op,sheet:M[m].s,id:rec.id,rec:op==='delete'?null:rec,t:Date.now()})}
function upsert(m,rec){const l=L(m),i=l.findIndex(x=>x.id===rec.id),now=new Date().toISOString();let r=rec;
 if(i<0){rec.created=now;rec.by=DB.me;l.push(rec)}else r=Object.assign(l[i],rec);r.updated=now;enq('upsert',m,r);save();return r}
async function del(m,id){if(!confirm('¿Eliminar este registro? No se puede deshacer.'))return;const x=L(m).find(a=>a.id===id);
 for(const k in(x.files||{})){await IDB.del(id+':'+k);const f=x.files[k];if(f.driveId)DB.q.push({op:'deleteFile',sheet:'_Drive',id:f.driveId,rec:null,t:Date.now()})}DB.data[m]=L(m).filter(a=>a.id!==id);enq('delete',m,{id});save();render()}
function tog(m,id){const x=L(m).find(a=>a.id===id);x.done=!x.done;x.doneAt=x.done?today():'';
 if(m==='tasks'&&x.done&&x.rec&&x.rec!=='No'&&x.due){const n=occ({date:x.due,rec:x.rec},addD(x.due,1));upsert('tasks',{id:uid(),title:x.title,who:x.who,due:n,prio:x.prio,cat:x.cat,rec:x.rec})}
 upsert(m,x);render()}
function openForm(m,id,pre){const d=M[m],x=id?L(m).find(a=>a.id===id):Object.assign({},pre);
 const h=d.f.map(([k,l,t,o,q])=>{const op=typeof o==='function'?o():o;let v=x[k]??(t==='sel'?op[0]:t==='who'?DB.me:t==='date'&&q?today():''),c;
  if(t==='sel')c=`<select name="${k}">${op.map(a=>`<option ${a==v?'selected':''}>${esc(a)}</option>`).join('')}</select>`;
  else if(t==='who')c=`<select name="${k}">${W().map(([a,b])=>`<option value="${a}" ${a==v?'selected':''}>${esc(b)}</option>`).join('')}</select>`;
  else if(t==='area')c=`<textarea name="${k}" rows="3">${esc(v)}</textarea>`;
  else if(t==='check')c=`<input type="checkbox" name="${k}" ${v?'checked':''}>`;
  else if(t==='file')c=`<input type="file" name="${k}" accept="${op||'*/*'}" ${q&&!(x.files||{})[k]?'required':''}>`+((x.files||{})[k]?`<small>Actual: ${esc(x.files[k].name)}</small>`:'');
  else c=`<input name="${k}" type="${t}" value="${esc(v)}" ${t==='number'?'step="any" inputmode="decimal"':''} ${q?'required':''}>`;
  return`<label>${l}${c}</label>`}).join('');
 $('#modal').innerHTML=`<div><form id="f"><h3>${id?'Editar':'Nuevo'}: ${d.t}</h3>${h}<div class="row" style="margin-top:12px"><button class="p">Guardar</button><button type="button" class="s" onclick="closeM()">Cancelar</button></div></form></div>`;
 $('#modal').classList.add('on');
 $('#f').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),r=Object.assign({},x,{id:x.id||uid()});r.files=Object.assign({},x.files);
  for(const[k,l,t]of d.f){if(t==='check')r[k]=fd.get(k)==='on';else if(t==='number')r[k]=parseFloat(fd.get(k))||0;else if(t==='file'){const f=fd.get(k);if(f&&f.size){await IDB.put(r.id+':'+k,f);r.files[k]={name:f.name,type:f.type,size:f.size}}}else r[k]=fd.get(k)}
  if(d.on)d.on(r);if(m==='shop'&&!r.list)r.list=S.list||'Súper';upsert(m,r);closeM();render()}}
const closeM=()=>$('#modal').classList.remove('on'),edit=(m,id)=>openForm(m,id);
async function openF(id,k){const x=Object.values(DB.data).flat().find(a=>a.id===id),f=x.files[k],b=await IDB.get(id+':'+k);
 if(!b){if(f.driveId)return window.open('https://drive.google.com/file/d/'+f.driveId+'/view');return toast('Archivo no disponible en este dispositivo')}
 const u=URL.createObjectURL(b);if(f.type.startsWith('image/')){$('#modal').innerHTML=`<div style="text-align:center"><img src="${u}" style="max-width:100%;max-height:75vh"><p><b>${esc(x.title||'')}</b><br><small>${esc(x.desc||'')}</small></p><button class="s" onclick="closeM()">Cerrar</button></div>`;$('#modal').classList.add('on')}
 else{const a=document.createElement('a');a.href=u;a.download=f.name;a.click()}}
function thumbs(){document.querySelectorAll('img[data-fk]').forEach(async el=>{try{const b=await IDB.get(el.dataset.fk);if(b)el.src=URL.createObjectURL(b);else if(el.dataset.d)el.src='https://drive.google.com/thumbnail?id='+el.dataset.d}catch(e){}})}
/* ============ ADAPTADORES (Apps Script / Drive) — no hacen nada sin configurar ============ */
const Sync={c(){const c=DB.int.sheets||{};return c.on&&c.url&&c.token?c:null},
 async call(op,p){const c=this.c();if(!c)throw Error('Pendiente de configurar (Configuración > Integraciones)');
  const r=await fetch(c.url,{method:'POST',body:JSON.stringify(Object.assign({token:c.token,sheetId:c.sheetId,op},p))});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(!j.ok)throw Error(j.error||'Error del servicio');return j},
 async push(){const ops=DB.q.slice();if(!ops.length)return;
  for(const o of ops)if(o.rec&&o.rec.files)for(const k in o.rec.files){const f=o.rec.files[k];if(!f.driveId&&Drive.on()){const b=await IDB.get(o.id+':'+k);if(b){f.driveId=(await Drive.upload(b,f.name,o.sheet)).fileId;const lr=Object.values(DB.data).flat().find(a=>a.id===o.id);if(lr&&lr.files&&lr.files[k])lr.files[k].driveId=f.driveId}}}
  await this.call('batch',{ops:ops.map(o=>({op:o.op,sheet:o.sheet,id:o.id,record:o.rec}))});DB.q=DB.q.filter(o=>!ops.includes(o));ops.forEach(o=>{if(o.op==='upsert')DB.known[o.id]=1;else delete DB.known[o.id]});DB.last=new Date().toISOString();save()},
 async pull(){const j=await this.call('pullAll',{});for(const m in M){const rs=(j.data||{})[M[m].s];if(!rs)continue;rs.forEach(r=>{DB.known[r.id]=1;const l=L(m),i=l.findIndex(a=>a.id===r.id);if(DB.q.some(o=>o.id===r.id))return;if(i<0)l.push(r);else if((r.updated||'')>(l[i].updated||''))l[i]=Object.assign(l[i],r)});const ids=new Set(rs.map(r=>r.id));DB.data[m]=L(m).filter(a=>ids.has(a.id)||!DB.known[a.id]||DB.q.some(o=>o.id===a.id))}DB.last=new Date().toISOString();save()}};
const Drive={on(){const c=DB.int.drive;return Sync.c()&&c&&c.on&&c.folderId},
 async upload(b,name,sheet){const data=await new Promise(a=>{const r=new FileReader();r.onload=()=>a(r.result.split(',')[1]);r.readAsDataURL(b)});return Sync.call('uploadFile',{name,mime:b.type,folder:DB.int.drive.folderId,subfolder:sheet,data})}};
function enqAll(){for(const m in M)L(m).forEach(r=>{if(!DB.known[r.id]&&!DB.q.some(o=>o.id===r.id))enq('upsert',m,r)})}
